<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1118">
<title>BT Battery Manager Pro</title>
<style>
:root{--bg:#eef1fb;--bg2:#dfe6ff;--card:rgba(255,255,255,.62);--bd:rgba(80,90,140,.16);--tx:#161a2b;--mu:#5d647f;--ac:#5b6cff;--ac2:#9b5bff;--ok:#18b26b;--warn:#f0a020;--bad:#e5484d;--seg:rgba(90,100,150,.18);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1118;--bg2:#1a1f3a;--card:rgba(32,38,62,.55);--bd:rgba(160,170,255,.14);--tx:#eef0ff;--mu:#9aa2c4;--seg:rgba(160,170,255,.14);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1118;--bg2:#1a1f3a;--card:rgba(32,38,62,.55);--bd:rgba(160,170,255,.14);--tx:#eef0ff;--mu:#9aa2c4;--seg:rgba(160,170,255,.14);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(900px 500px at 10% -10%,var(--bg2),transparent),radial-gradient(700px 500px at 100% 0,rgba(155,91,255,.18),transparent),var(--bg);background-color:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{max-width:640px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:0}h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:center}
h3{margin:0;font-size:16px}small,.mu{color:var(--mu)}small{font-size:12px}
.glass{background:var(--card);border:1px solid var(--bd);border-radius:24px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 30px rgba(20,25,60,.12)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hero{padding:18px;background:linear-gradient(135deg,rgba(91,108,255,.28),rgba(155,91,255,.2)),var(--card)}
.stats{display:flex;gap:10px;margin:14px 0}
.stat{flex:1;padding:10px 12px;border-radius:16px;background:var(--seg)}
.stat b{display:block;font-size:22px}
.btns{display:flex;gap:10px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{flex:1;padding:13px;border-radius:999px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:600}
.btn.alt{background:var(--seg);color:var(--tx)}
.btn:active,.card:active{transform:scale(.98)}
.ib{width:40px;height:40px;border-radius:50%;background:var(--seg);font-size:18px}
.card{padding:14px;margin-bottom:10px;cursor:pointer;transition:transform .15s}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.ico{width:46px;height:46px;border-radius:16px;background:var(--seg);display:grid;place-items:center;font-size:24px;flex:none}
.star{background:none;font-size:20px;opacity:.5}.star.on{opacity:1}
.pill{padding:5px 10px;border-radius:999px;font-weight:700;font-size:13px;background:var(--seg)}
.lv-ok .pill,.lv-ok .pct{color:var(--ok)}.lv-warn .pill,.lv-warn .pct{color:var(--warn)}.lv-bad .pill,.lv-bad .pct{color:var(--bad)}
.tws{padding:18px;background:linear-gradient(160deg,rgba(91,108,255,.2),transparent 60%),var(--card)}
.br{display:flex;align-items:center;gap:10px;margin-top:12px}.br span.l{width:74px;font-size:12px;color:var(--mu)}
.seg{display:flex;gap:4px;flex:1}.seg i{flex:1;height:18px;border-radius:5px;background:var(--seg);transition:background .4s}
.seg i.on{background:currentColor}
.lv-ok .seg{color:var(--ok)}.lv-warn .seg{color:var(--warn)}.lv-bad .seg{color:var(--bad)}
.anim .seg i.on{animation:pop .55s both}@keyframes pop{from{transform:scaleY(.2);opacity:0}}
.pct{width:44px;text-align:right;font-weight:700}
.sig{display:inline-flex;gap:2px;align-items:flex-end;height:14px}.sig i{width:3px;background:var(--seg);border-radius:2px}.sig i.on{background:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.chip{flex:none;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--bd);font-size:13px}
.empty{padding:18px;text-align:center;color:var(--mu);border:1px dashed var(--bd);border-radius:20px}
.scan{display:inline-block;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:50;pointer-events:none}
.toast{padding:10px 16px;border-radius:16px;background:var(--tx);color:var(--bg);font-size:14px;max-width:90%;animation:pop .3s both}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;background:var(--bg);border:1px solid var(--bd)}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}.kv:last-child{border:0}
svg.ch{width:100%;height:90px;margin:8px 0}
input[type=range]{width:100%;accent-color:var(--ac)}
.sw{display:flex;gap:8px}.sw button{flex:1;padding:10px;border-radius:14px;background:var(--seg)}.sw button.on{background:var(--ac);color:#fff}
</style></head>
<body><div id="app"><p style="padding:40px;text-align:center">BT Battery Manager Pro yükleniyor…</p></div><div id="toasts"></div>
<noscript><p style="padding:20px">Uygulama JavaScript gerektirir.</p></noscript>
<script>
/* BT Battery Manager Pro — tek dosya.
 ANDROID/CAPACITOR KÖPRÜSÜ: native taraf (BluetoothAdapter/BluetoothManager/BluetoothDevice, gizli BluetoothDevice.getBatteryLevel
 veya HFP "android.bluetooth.device.extra.BATTERY_LEVEL") şu çağrıyla veri gönderir:
   window.BTBridge.receive([{id:"AA:BB..",name:"Galaxy Buds FE",paired:true,connected:true,rssi:-52,battery:{l:85,r:82,c:60}}])
 veya WebView'de window.Android.getDevices() JSON döndürebilir; yoksa Web Bluetooth, o da yoksa yerel demo verisi kullanılır. */
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ICON={tws:'🎧',speaker:'🔊',keyboard:'⌨',mouse:'🖱',car:'🚗',watch:'⌚',other:'📶'};
const BRANDS=[['Nothing Ear',/nothing\s*ear/i],['CMF Buds',/cmf/i],['Samsung Galaxy Buds',/galaxy\s*buds|buds\d|buds\s*(fe|pro|live)/i],['Apple AirPods',/airpods/i],['Huawei FreeBuds',/freebuds/i],['Sony WF',/\bwf-|sony.*(wf|buds)/i],['Anker Soundcore',/soundcore|liberty|life\s*p/i],['Beats',/beats/i],['Redmi Buds',/redmi\s*buds/i],['Xiaomi Buds',/xiaomi\s*buds|mi\s*(true|buds)/i],['OnePlus Buds',/oneplus\s*buds|\bbuds\s*(z|3|pro)/i],['Realme Buds',/realme\s*buds/i],['QCY',/qcy/i],['Haylou',/haylou/i],['JBL',/jbl/i]];
function detect(n){n=n||'';for(const[b,r]of BRANDS)if(r.test(n)){const sp=/flip|charge|go\s?\d|clip|xtreme|boombox|hoparl|speaker/i.test(n);return{brand:b,type:sp?'speaker':(b==='JBL'&&!/tws|tune|live|wave|buds|vibe|tour/i.test(n)?'speaker':'tws')}}
 const t=/klavye|keyboard|keys/i.test(n)?'keyboard':/mouse|fare|mx\s?master/i.test(n)?'mouse':/araç|araba|car|carplay|auto|bmw|audi|toyota|ford|renault|fiat/i.test(n)?'car':/watch|saat|band|fit/i.test(n)?'watch':/hoparl|speaker|soundbar|boom/i.test(n)?'speaker':/buds|ear|pod|tws/i.test(n)?'tws':'other';return{brand:'',type:t}}
const S=Object.assign({theme:'auto',low:20,bt:true},store.get('btm.set',{}));
const applyTheme=()=>{const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.theme)};applyTheme();
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),3200);try{if(window.Notification&&Notification.permission==='granted'&&document.hidden)new Notification('BT Battery Manager Pro',{body:m})}catch(x){}}
/* ---------- deviceManager ---------- */
const DM=(()=>{let devs=store.get('btm.devs',{});const L=[];
const save=()=>store.set('btm.devs',devs),emit=(e,d)=>L.forEach(f=>{try{f(e,d)}catch(x){}});
const prim=o=>{const b=o.battery||{};const a=[b.l,b.r].filter(x=>x!=null);return a.length?Math.min(...a):(b.s!=null?b.s:null)};
function upsert(p){const id=p.id||p.name;if(!id)return;const o=devs[id]||{id,history:[],usage:0,fav:false,paired:false,connected:false,battery:{}};const was=o.connected;
 const bat=Object.assign({},o.battery,p.battery);Object.assign(o,p,{id,battery:bat});
 if(p.name||!o.brand&&!o.type){const d=detect(o.name);o.brand=d.brand;o.type=p.type||d.type}
 o.lastSeen=Date.now();
 if(o.connected&&!was){o.since=Date.now();o.lastConn=Date.now()}
 if(!o.connected&&was){if(o.since)o.usage+=Date.now()-o.since;o.since=0;if(!p.silent)toast(o.name+' bağlantısı koptu');emit('disconnect',o)}
 if(p.battery){const v=prim(o);if(v!=null){const h=o.history,last=h[h.length-1];if(!last||last[1]!==v||Date.now()-last[0]>6e5){h.push([Date.now(),v]);if(h.length>80)h.shift()}
  if(o.connected&&v<=S.low&&!o.warned){o.warned=1;toast('⚠️ '+o.name+' pili düşük: %'+v)}if(v>S.low+5)o.warned=0}}
 devs[id]=o;save();emit('update',o);return o}
return{upsert,prim,all:()=>Object.values(devs),get:id=>devs[id],forget(id){delete devs[id];save();emit('update')},on:f=>L.push(f),
 usage:o=>(o.usage||0)+(o.since?Date.now()-o.since:0),toggleFav(id){if(devs[id]){devs[id].fav=!devs[id].fav;save();emit('update')}}}})();
/* ---------- veri kaynakları ---------- */
const gatts={};let nearby=[],scanning=false,sheet=null,sheetKind=null;
const hasWB=!!(navigator&&navigator.bluetooth);
const hasNative=!!(window.Android&&window.Android.getDevices)||!!(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.BluetoothBridge);
function bridgeIn(list){try{(list||[]).forEach(d=>{d.demo=false;DM.upsert(Object.assign({paired:true},d))})}catch(e){}}
window.BTBridge={receive:bridgeIn};
async function pollNative(){try{if(window.Android&&window.Android.getDevices)bridgeIn(JSON.parse(window.Android.getDevices()));else{const P=window.Capacitor.Plugins.BluetoothBridge;const r=await P.getDevices();bridgeIn(r.devices||r)}}catch(e){}}
async function wbPick(){const o=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['battery_service','device_information']});
 const id=o.id||o.name||('wb'+Date.now());DM.upsert({id,name:o.name||'Bilinmeyen Cihaz',paired:true,demo:false});
 try{const s=await o.gatt.connect();gatts[id]=o.gatt;DM.upsert({id,connected:true});
  o.addEventListener('gattserverdisconnected',()=>DM.upsert({id,connected:false}));
  try{const sv=await s.getPrimaryService('battery_service'),ch=await sv.getCharacteristic('battery_level');
   const v=await ch.readValue();DM.upsert({id,battery:{s:v.getUint8(0)}});
   try{await ch.startNotifications();ch.addEventListener('characteristicvaluechanged',e=>DM.upsert({id,battery:{s:e.target.value.getUint8(0)}}))}catch(e){}
  }catch(e){toast('Bu cihaz standart pil servisi sunmuyor')}
 }catch(e){toast('Cihaza bağlanılamadı, listede kayıtlı olarak tutuldu')}}
async function loadPermitted(){try{if(navigator.bluetooth&&navigator.bluetooth.getDevices){const l=await navigator.bluetooth.getDevices();l.forEach(o=>DM.upsert({id:o.id||o.name,name:o.name||'Bilinmeyen Cihaz',paired:true,demo:false}))}}catch(e){}}
/* yerel simülasyon (gerçek veri yoksa çalışan alternatif) */
const POOL=['Galaxy Buds2 Pro','Redmi Buds 5','Nothing Ear (a)','Sony WF-1000XM5','CMF Buds Pro','Soundcore Liberty 4','QCY T13','Haylou GT7','OnePlus Buds 3','realme Buds T300','Beats Studio Buds','JBL Tune 230NC TWS','Huawei FreeBuds 6i','Xiaomi Buds 4','Akıllı Saat','Bluetooth Hoparlör'];
const rnd=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
function mkBat(type){return type==='tws'?{l:rnd(35,98),r:rnd(35,98),c:rnd(20,95)}:{s:rnd(30,98)}}
function seed(){if(DM.all().length)return;const now=Date.now();
 const add=(name,p)=>{const o=DM.upsert(Object.assign({id:'demo-'+name,name,paired:true,demo:true},p));
  if(o.battery&&DM.prim(o)!=null){const v=DM.prim(o);o.history=Array.from({length:20},(_,i)=>[now-(19-i)*6e5,Math.min(100,v+Math.round((19-i)*.6))])}};
 add('Galaxy Buds FE',{connected:true,fav:true,battery:{l:85,r:82,c:60},rssi:-48});
 add('JBL Flip 6',{connected:true,battery:{s:72},rssi:-60});
 add('AirPods Pro',{battery:{l:90,r:88,c:71}});add('Bluetooth Klavye',{battery:{s:64}});add('Kablosuz Mouse',{battery:{s:41}});add('Araç Bluetooth',{})}
function simScan(){const pick=POOL.slice().sort(()=>Math.random()-.5).slice(0,rnd(5,8));
 nearby=pick.map(n=>{const d=detect(n);return{id:'sc-'+n,name:n,type:d.type,brand:d.brand,rssi:-rnd(40,92),battery:Math.random()>.35?mkBat(d.type):null}}).sort((a,b)=>b.rssi-a.rssi)}
const dist=r=>{const m=Math.pow(10,(-59-r)/20);return m<1?'<1 m':'~'+m.toFixed(m<10?1:0)+' m'};
async function doScan(){if(scanning)return;scanning=true;render();
 if(hasNative)await pollNative();
 if(hasWB){try{await wbPick()}catch(e){if(e&&e.name==='NotFoundError')toast('Cihaz seçilmedi')}}
 await new Promise(r=>setTimeout(r,1400));simScan();scanning=false;render()}
setInterval(()=>{DM.all().filter(o=>o.demo&&o.connected).forEach(o=>{if(Math.random()<.3){const b=Object.assign({},o.battery);const k=['l','r','s'].filter(x=>b[x]!=null)[rnd(0,['l','r','s'].filter(x=>b[x]!=null).length-1)];if(k&&b[k]>1){b[k]--;DM.upsert({id:o.id,battery:b})}}});if(hasNative)pollNative()},5000);
/* ---------- görünüm ---------- */
const lv=p=>p==null?'':p<=15?'lv-bad':p<=S.low+10?'lv-warn':'lv-ok';
const seg=p=>'<div class="seg">'+Array.from({length:10},(_,i)=>'<i class="'+(i<Math.round((p||0)/10)?'on':'')+'" style="animation-delay:'+i*45+'ms"></i>').join('')+'</div>';
const dur=ms=>{const m=Math.floor(ms/6e4);return m<60?m+' dk':Math.floor(m/60)+' sa '+m%60+' dk'};
const ago=t=>{if(!t)return'—';const m=Math.floor((Date.now()-t)/6e4);return m<1?'az önce':m<60?m+' dk önce':m<1440?Math.floor(m/60)+' sa önce':Math.floor(m/1440)+' gün önce'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sig=r=>{const n=r>-55?4:r>-67?3:r>-78?2:1;return'<span class="sig">'+[5,8,11,14].map((h,i)=>'<i class="'+(i<n?'on':'')+'" style="height:'+h+'px"></i>').join('')+'</span>'};
const star=o=>'<button class="star '+(o.fav?'on':'')+'" data-act="fav" data-id="'+esc(o.id)+'">'+(o.fav?'★':'☆')+'</button>';
function twsCard(o){const b=o.battery||{};const rows=[['Sol Kulaklık',b.l],['Sağ Kulaklık',b.r],['Şarj Kutusu',b.c]].filter(r=>r[1]!=null);
 return'<div class="card glass tws" data-act="open" data-id="'+esc(o.id)+'"><div class="row"><div class="ico">🎧</div><div class="grow"><h3>'+esc(o.name)+'</h3><small>'+esc(o.brand||'TWS Kulaklık')+' · Bağlı · '+dur(DM.usage(o))+' kullanım</small></div>'+star(o)+'</div>'+
 rows.map(r=>'<div class="br '+lv(r[1])+'"><span class="l">'+r[0]+'</span>'+seg(r[1])+'<span class="pct">%'+r[1]+'</span></div>').join('')+(rows.length?'':'<p class="mu">Pil bilgisi bekleniyor…</p>')+'</div>'}
function card(o){if(o.type==='tws'&&o.connected)return twsCard(o);const p=DM.prim(o),b=o.battery||{};
 const sub=o.type==='tws'&&b.l!=null?'Sol %'+b.l+' · Sağ %'+b.r+(b.c!=null?' · Kutu %'+b.c:''):(o.connected?'Bağlı · '+dur(DM.usage(o)):'Son bağlantı: '+ago(o.lastConn||o.lastSeen));
 return'<div class="card glass '+lv(p)+'" data-act="open" data-id="'+esc(o.id)+'"><div class="row"><div class="ico">'+ICON[o.type||'other']+'</div><div class="grow"><h3>'+esc(o.name)+'</h3><small>'+esc(sub)+'</small></div>'+(p!=null?'<span class="pill">%'+p+'</span>':'')+star(o)+'</div></div>'}
function nearCard(n){return'<div class="card glass"><div class="row"><div class="ico">'+ICON[n.type]+'</div><div class="grow"><h3>'+esc(n.name)+'</h3><small>'+(n.brand||{tws:'Kulaklık',speaker:'Hoparlör',watch:'Saat',other:'Cihaz'}[n.type]||'Cihaz')+' · '+n.rssi+' dBm · '+dist(n.rssi)+(n.battery?' · %'+(DM.prim({battery:n.battery})):'')+'</small></div>'+sig(n.rssi)+'<button class="pill" data-act="pair" data-id="'+esc(n.id)+'" style="background:var(--ac);color:#fff">Bağlan</button></div></div>'}
function chart(h){if(!h||h.length<2)return'<p class="mu">Henüz yeterli geçmiş verisi yok.</p>';const t0=h[0][0],t1=h[h.length-1][0]||t0+1,pts=h.map(p=>((p[0]-t0)/Math.max(1,t1-t0)*290+5).toFixed(1)+','+(85-p[1]*.8).toFixed(1)).join(' ');
 return'<svg class="ch" viewBox="0 0 300 90" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><polygon points="5,85 '+pts+' 295,85" fill="var(--ac)" opacity=".15"/></svg>'}
function detail(o){const b=o.battery||{};const kv=(k,v)=>'<div class="kv"><span class="mu">'+k+'</span><b>'+v+'</b></div>';
 return'<div class="row"><div class="ico">'+ICON[o.type||'other']+'</div><div class="grow"><h3>'+esc(o.name)+'</h3><small>'+esc(o.brand||'Bluetooth cihazı')+'</small></div>'+star(o)+'</div>'+
 (o.type==='tws'&&(b.l!=null||b.r!=null)?[['Sol',b.l],['Sağ',b.r],['Kutu',b.c]].filter(r=>r[1]!=null).map(r=>'<div class="br '+lv(r[1])+'"><span class="l">'+r[0]+'</span>'+seg(r[1])+'<span class="pct">%'+r[1]+'</span></div>').join(''):DM.prim(o)!=null?'<div class="br '+lv(DM.prim(o))+'"><span class="l">Pil</span>'+seg(DM.prim(o))+'<span class="pct">%'+DM.prim(o)+'</span></div>':'')+
 '<h2>Pil geçmişi</h2>'+chart(o.history)+'<h2>Detaylar</h2>'+kv('Durum',o.connected?'Bağlı':'Bağlı değil')+kv('Eşleşme',o.paired?'Eşleştirilmiş':'Eşleştirilmemiş')+kv('Kimlik',esc(String(o.id).slice(0,22)))+kv('Sinyal',o.rssi?o.rssi+' dBm · '+dist(o.rssi):'—')+kv('Toplam kullanım',dur(DM.usage(o)))+kv('Son görülme',ago(o.lastSeen))+kv('Veri kaynağı',o.demo?'Yerel demo':hasNative?'Android köprüsü':'Web Bluetooth')+
 '<div class="btns" style="margin-top:16px"><button class="btn alt" data-act="tog" data-id="'+esc(o.id)+'">'+(o.connected?'Bağlantıyı kes':'Bağlan')+'</button><button class="btn alt" data-act="forget" data-id="'+esc(o.id)+'" style="color:var(--bad)">Cihazı unut</button></div>'}
function settings(){return'<h3>Ayarlar</h3><h2>Tema</h2><div class="sw">'+[['auto','Otomatik'],['light','Açık'],['dark','Koyu']].map(t=>'<button class="'+(S.theme===t[0]?'on':'')+'" data-act="theme" data-id="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'+
 '<h2>Düşük pil uyarısı: %'+S.low+'</h2><input type="range" min="5" max="50" step="5" value="'+S.low+'" data-act="low">'+
 '<h2>Bildirimler</h2><button class="btn alt" style="width:100%" data-act="notif">Sistem bildirimlerine izin ver</button>'+
 '<h2>Veri kaynakları</h2><div class="kv"><span class="mu">Android köprüsü</span><b>'+(hasNative?'Aktif':'Hazır (bekliyor)')+'</b></div><div class="kv"><span class="mu">Web Bluetooth</span><b>'+(hasWB?'Kullanılabilir':'Yok — yerel veri')+'</b></div><div class="kv"><span class="mu">Yerel veri katmanı</span><b>Aktif</b></div>'}
function render(){try{const all=DM.all(),sorter=(a,b)=>(b.fav-a.fav)||(b.lastSeen-a.lastSeen);
 const con=all.filter(o=>o.connected).sort(sorter),pair=all.filter(o=>o.paired&&!o.connected).sort(sorter),rec=all.filter(o=>o.lastConn).sort((a,b)=>b.lastConn-a.lastConn).slice(0,6),demo=all.some(o=>o.demo);
 $('#app').innerHTML='<div class="top"><div><h1>BT Battery Manager Pro</h1><small>'+(demo?'Demo verisi · gerçek cihaz için Tara’ya dokunun':'Canlı cihaz verisi')+'</small></div><button class="ib" data-act="settings">⚙</button></div>'+
 '<div class="glass hero"><div class="row"><div class="grow"><h3>Bluetooth '+(S.bt?'Açık':'Kapalı')+'</h3><small>'+(S.bt?'Cihazlar izleniyor':'Kayıtlı veriler gösteriliyor')+'</small></div><button class="pill" data-act="bt" style="background:'+(S.bt?'var(--ok)':'var(--seg)')+';color:'+(S.bt?'#fff':'inherit')+'">'+(S.bt?'AÇIK':'KAPALI')+'</button></div>'+
 '<div class="stats"><div class="stat"><b>'+con.length+'</b><small>Bağlı cihaz</small></div><div class="stat"><b>'+pair.length+'</b><small>Eşleşmiş</small></div><div class="stat"><b>'+nearby.length+'</b><small>Yakında</small></div></div>'+
 '<div class="btns"><button class="btn" data-act="scan">'+(scanning?'<span class="scan">⟳</span> Taranıyor…':'🔍 Tara')+'</button><button class="btn alt" data-act="refresh">↻ Yenile</button></div></div>'+
 (rec.length?'<h2>Son bağlantılar</h2><div class="chips">'+rec.map(o=>'<span class="chip" data-act="open" data-id="'+esc(o.id)+'">'+ICON[o.type||'other']+' '+esc(o.name)+'</span>').join('')+'</div>':'')+
 '<h2>Bağlı Cihazlar <span>'+con.length+'</span></h2>'+(con.map(card).join('')||'<div class="empty">Bağlı cihaz yok. Tara’ya dokunarak cihaz bulun.</div>')+
 '<h2>Eşleştirilmiş Cihazlar <span>'+pair.length+'</span></h2>'+(pair.map(card).join('')||'<div class="empty">Eşleştirilmiş cihaz yok.</div>')+
 '<h2>Yakındaki Cihazlar <span>'+(scanning?'taranıyor…':nearby.length)+'</span></h2>'+(nearby.map(nearCard).join('')||'<div class="empty">Henüz tarama yapılmadı. Canlı tarama için Tara’ya dokunun.</div>');
 renderSheet()}catch(e){$('#app').innerHTML='<div class="empty">Ekran yenileniyor… <button class="btn" onclick="location.reload()">Yeniden başlat</button></div>'}}
function renderSheet(){let bg=$('.sheet-bg');if(!sheet){bg&&bg.remove();return}
 const o=sheetKind==='dev'?DM.get(sheet):null;const html=sheetKind==='set'?settings():o?detail(o):'';if(!html){sheet=null;if(bg)bg.remove();return}
 if(!bg){bg=document.createElement('div');bg.className='sheet-bg';bg.dataset.act='close';bg.innerHTML='<div class="sheet"></div>';document.body.appendChild(bg)}
 const sh=$('.sheet',bg),y=sh.scrollTop;sh.innerHTML=html;sh.scrollTop=y}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id;
 if(a==='close'){if(e.target===t){sheet=null;renderSheet()}return}
 if(a==='fav'){e.stopPropagation();DM.toggleFav(id)}
 else if(a==='open'){sheet=id;sheetKind='dev';render()}
 else if(a==='settings'){sheet=1;sheetKind='set';render()}
 else if(a==='scan'){if(S.bt)doScan();else toast('Önce Bluetooth’u açın')}
 else if(a==='refresh'){if(hasNative)pollNative();if(hasWB)loadPermitted();render();toast('Liste yenilendi')}
 else if(a==='bt'){S.bt=!S.bt;store.set('btm.set',S);if(!S.bt)DM.all().filter(o=>o.connected).forEach(o=>DM.upsert({id:o.id,connected:false,silent:true}));render()}
 else if(a==='pair'){const n=nearby.find(x=>x.id===id);if(n){DM.upsert({id:n.id,name:n.name,paired:true,connected:true,demo:true,rssi:n.rssi,battery:n.battery||mkBat(n.type)});nearby=nearby.filter(x=>x!==n);toast(n.name+' bağlandı')}}
 else if(a==='tog'){const o=DM.get(id);if(o){try{if(gatts[id]){o.connected?gatts[id].disconnect():await gatts[id].connect()}}catch(x){}DM.upsert({id,connected:!o.connected,silent:true})}}
 else if(a==='forget'){DM.forget(id);sheet=null}
 else if(a==='theme'){S.theme=id;store.set('btm.set',S);applyTheme();render()}
 else if(a==='notif'){try{const p=await Notification.requestPermission();toast(p==='granted'?'Bildirimler açıldı':'Uygulama içi uyarılar kullanılacak')}catch(x){toast('Uygulama içi uyarılar kullanılacak')}}});
document.addEventListener('input',e=>{if(e.target.dataset.act==='low'){S.low=+e.target.value;store.set('btm.set',S);const h=e.target.previousElementSibling;if(h)h.textContent='Düşük pil uyarısı: %'+S.low}});
DM.on(e=>{if(e==='update'||e==='disconnect'){clearTimeout(DM._t);DM._t=setTimeout(render,120)}});
/* widget'a hazır küçük çıktı: BTM.widget(id) -> HTML parçası */
window.BTM={DM,detect,widget(id){const o=DM.get(id);if(!o)return'';const p=DM.prim(o);return'<div style="font:14px system-ui;padding:12px;border-radius:20px;background:#1a1f3a;color:#fff">'+ICON[o.type]+' '+esc(o.name)+' '+(p!=null?'%'+p:'')+'</div>'}};
window.addEventListener('error',()=>{try{if(!$('#app').children.length)render()}catch(x){}});
try{seed();loadPermitted();if(hasNative)pollNative();simScan();nearby=nearby.slice(0,0)}catch(e){}
document.body.classList.add('anim');render();setTimeout(()=>document.body.classList.remove('anim'),1500);
if('serviceWorker' in navigator&&location.protocol==='https:'&&0){}
})();
</script></body></html>
