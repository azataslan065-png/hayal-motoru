<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6750a4">
<title>BT Yönetici</title>
<style>
/* ===== Tema (Material You: --h tohum rengi) ===== */
:root{--h:262;--r:24px;
--p:hsl(var(--h) 70% 55%);--p2:hsl(calc(var(--h) + 50) 80% 60%);
--bg:#f6f3fb;--sf:rgba(255,255,255,.62);--bd:rgba(120,100,170,.18);--tx:#1d1b22;--mu:#6b6578;--ok:#1f9d55;--wa:#e0a100;--er:#d33b3b;--sh:0 8px 30px rgba(60,40,110,.12)}
[data-theme=dark]{--bg:#121016;--sf:rgba(40,36,52,.6);--bd:rgba(255,255,255,.09);--tx:#ece8f5;--mu:#a29bb3;--sh:0 8px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.4 system-ui,Roboto,sans-serif;color:var(--tx);background:var(--bg);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 40% at 15% 0,color-mix(in srgb,var(--p) 30%,transparent),transparent),radial-gradient(50% 40% at 100% 100%,color-mix(in srgb,var(--p2) 25%,transparent),transparent)}
button,input,select{font:inherit;color:inherit}
.glass{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--sh)}
.btn{border:0;border-radius:99px;padding:10px 18px;cursor:pointer;background:var(--sf);border:1px solid var(--bd);transition:transform .15s,filter .15s}
.btn:active{transform:scale(.95)}.btn.pri{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0}
.btn.sm{padding:6px 12px;font-size:13px}
/* Açılış */
#splash{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:var(--bg);transition:opacity .5s}
#splash.off{opacity:0;pointer-events:none}
.logo{width:96px;height:96px;border-radius:30px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--p2));animation:pulse 1.6s infinite}
.logo svg{width:52px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 24px color-mix(in srgb,var(--p) 15%,transparent)}}
#sp-steps{margin-top:24px;color:var(--mu);font-size:13px;text-align:center;min-height:60px}
/* Düzen */
#app{display:grid;grid-template-columns:1fr;max-width:1100px;margin:auto;padding:12px 12px 90px;gap:12px}
header.top{padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:8px;z-index:5}
.st{display:flex;align-items:center;gap:10px}.dot{width:12px;height:12px;border-radius:50%;background:var(--er)}.dot.on{background:var(--ok);box-shadow:0 0 0 6px color-mix(in srgb,var(--ok) 25%,transparent)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6;border-radius:24px 24px 0 0}
nav button{background:none;border:0;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);cursor:pointer;border-radius:16px;min-width:52px}
nav button.on{color:var(--p);background:color-mix(in srgb,var(--p) 14%,transparent)}
nav .i{font-size:20px}
@media(min-width:760px){#app{grid-template-columns:96px 1fr;padding-bottom:20px}header.top{grid-column:1/-1}
nav{position:sticky;top:110px;flex-direction:column;align-self:start;border-radius:var(--r);padding:8px}}
main{min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{padding:16px;animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.row{display:flex;align-items:center;gap:12px}.ico{font-size:30px;width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--p) 16%,transparent);flex:none}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{color:var(--mu);font-size:12.5px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--p) 18%,transparent);margin-right:4px;display:inline-block}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:12px 0;font-size:12.5px;color:var(--mu)}.meta b{color:var(--tx);font-weight:500}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ok),var(--p));transition:width .6s}
.bar i.low{background:var(--er)}
.tws{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tws div{padding:10px 6px;text-align:center;border-radius:18px;background:color-mix(in srgb,var(--p) 10%,transparent);font-size:12px}
.tws .big{font-size:20px;font-weight:700;display:block}.tws .chg::after{content:" ⚡";animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.note{padding:14px;font-size:13.5px;color:var(--mu);border-left:4px solid var(--p);margin-bottom:12px}
.empty{padding:40px 16px;text-align:center;color:var(--mu)}
input[type=search],select{width:100%;padding:12px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--sf);margin-bottom:12px}
.set{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd);gap:10px}
.set:last-child{border:0}.set input[type=range]{width:140px}
.sw{appearance:none;width:46px;height:26px;border-radius:99px;background:var(--bd);position:relative;cursor:pointer;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw:checked{background:var(--p)}.sw:checked::after{left:23px}
#toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:100;display:grid;gap:8px;width:min(92vw,380px)}
.toast{padding:12px 16px;animation:in .3s both}
svg.chart{width:100%;height:120px}
.ov{position:fixed;inset:0;z-index:120;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,8,16,.5);backdrop-filter:blur(6px);animation:fade .2s both}
.ov.out{opacity:0;transition:opacity .18s}.ov.out .sheet{transform:translateY(30px);transition:transform .18s}
.sheet{width:min(100%,520px);max-height:88vh;overflow:auto;padding:12px 18px calc(18px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:var(--bg);border:1px solid var(--bd);box-shadow:var(--sh);animation:up .3s cubic-bezier(.2,.8,.2,1) both}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:9px;background:var(--bd);margin:0 auto 14px}
.sheet h3{font-size:18px;margin-bottom:6px}.sheet p{color:var(--mu);font-size:13.5px;margin-bottom:14px}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;margin-bottom:8px;border-radius:18px;border:1px solid var(--bd);background:var(--sf);cursor:pointer;text-align:left}
.opt.sel{border-color:var(--p);background:color-mix(in srgb,var(--p) 14%,transparent)}
.opt .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--mu);flex:none}.opt.sel .rd{border:6px solid var(--p)}
.sheet textarea{width:100%;padding:14px 16px;border-radius:18px;border:1px solid var(--bd);background:var(--sf);margin-bottom:14px;resize:none;outline:none}
.sheet textarea:focus{border-color:var(--p)}.sheet .btns{display:flex;gap:8px;justify-content:flex-end}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(60px);opacity:0}}
@media(min-width:760px){.ov{align-items:center}.sheet{border-radius:28px}}
.noanim *{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="splash"><div style="text-align:center"><div class="logo" style="margin:auto"><svg viewBox="0 0 24 24"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg></div><div id="sp-steps"></div></div></div>
<div id="toasts"></div>
<div id="app" hidden>
  <header class="top glass">
    <div class="st"><span class="dot" id="dot"></span><div><div class="nm" id="stTxt">…</div><div class="sub" id="stSub"></div></div></div>
    <div class="acts">
      <button class="btn" data-act="refresh">⟳ <span data-i="refresh"></span></button>
      <button class="btn" data-act="enable"><span data-i="enable"></span></button>
      <button class="btn pri" data-act="scan">🔍 <span data-i="scan"></span></button>
    </div>
  </header>
  <nav class="glass" id="nav"></nav>
  <main id="view"></main>
</div>

<script>
/* ================= Yardımcılar ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDur=ms=>{const s=Math.floor(ms/1e3);return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')};
const ago=t=>t?new Date(t).toLocaleTimeString():'—';

/* ================= Depolama ================= */
const Store={
  get(k,d){try{return JSON.parse(localStorage.getItem('btm_'+k))??d}catch{return d}},
  set(k,v){try{localStorage.setItem('btm_'+k,JSON.stringify(v))}catch{}}
};

/* ================= Dil ================= */
const DICT={
 tr:{refresh:'Yenile',enable:'BT Aç',scan:'Tara',connected:'Bağlı',paired:'Eşleşen',nearby:'Yakın',favs:'Favori',history:'Geçmiş',settings:'Ayar',
  on:'Bluetooth açık',off:'Bluetooth kapalı',unsup:'Bu tarayıcı Web Bluetooth desteklemiyor',secure:'HTTPS veya localhost gerekli',
  nodev:'Gösterilecek cihaz yok.',connect:'Bağlan',disc:'Kes',fav:'Favori',unfav:'Favoriden çıkar',note:'Not',pickDev:'Cihaz seç'}
};
const t=k=>(DICT[S.lang]||DICT.tr)[k]??DICT.tr[k]??k;

/* ================= Durum ================= */
const S={
  lang:Store.get('lang','tr'),theme:Store.get('theme','auto'),hue:Store.get('hue',262),anim:Store.get('anim',true),
  notif:Store.get('notif',true),vib:Store.get('vib',true),auto:Store.get('auto',false),scanSec:Store.get('scanSec',10),demo:Store.get('demo',false),
  favs:Store.get('favs',{}),prev:Store.get('prev',[]),known:Store.get('known',{}),hist:Store.get('hist',[]),
  tab:'connected',q:'',btOn:null,devices:new Map(),scanning:false
};
const save=()=>['lang','theme','hue','anim','notif','vib','auto','scanSec','demo','favs','prev','known','hist'].forEach(k=>Store.set(k,S[k]));

/* ================= Marka / Simge ================= */
const BRANDS=[['Samsung',/galaxy|buds|samsung/i],['Apple',/airpods|apple|beats/i],['Sony',/sony|wh-|wf-|linkbuds/i],['JBL',/jbl/i],['Huawei',/huawei|freebuds|honor/i],['Nothing',/nothing|ear \(/i],['CMF',/cmf/i],['Xiaomi',/xiaomi|mi |buds 3|redmi/i],['OnePlus',/oneplus/i],['Realme',/realme/i],['QCY',/qcy/i],['Haylou',/haylou/i],['Anker',/anker|soundcore/i],['Baseus',/baseus/i],['Lenovo',/lenovo/i]];
const brandOf=n=>(BRANDS.find(b=>b[1].test(n||''))||[])[0]||null;
const iconOf=n=>/tv|televizyon|projeksiyon/i.test(n)?'📺':/redmi|phone|telefon|iphone|galaxy s/i.test(n)?'📱':/konsol|console|playstation|xbox/i.test(n)?'🎮':/buds|pods|ear|wf-|tune|tws/i.test(n)?'🎧':/wh-|headphone|beats|over/i.test(n)?'🎧':/mouse|fare/i.test(n)?'🖱️':/key|klav/i.test(n)?'⌨️':/pad|controller/i.test(n)?'🎮':/car|araç|multimedia/i.test(n)?'🚗':/speaker|hoparlör|flip|charge/i.test(n)?'🔊':'📶';

/* ================= Toast / Bildirim ================= */
const Notify={
  show(msg,type='info'){
    const el=document.createElement('div');el.className='toast glass';el.textContent=msg;$('#toasts').append(el);setTimeout(()=>el.remove(),3500);
    if(S.vib&&navigator.vibrate&&type!=='info')navigator.vibrate(40);
    if(S.notif&&type!=='info'&&'Notification' in window&&Notification.permission==='granted'&&document.hidden)try{new Notification('BT Yönetici',{body:msg})}catch{}
  },
  async ask(){if('Notification' in window&&Notification.permission==='default')try{await Notification.requestPermission()}catch{}}
};

/* ================= Özel açılır pencereler (alt sayfa) ================= */
const Modal={
  open(html){return new Promise(res=>{
    const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
    const kd=e=>e.key==='Escape'&&close(null);
    const close=v=>{document.removeEventListener('keydown',kd);o.classList.add('out');setTimeout(()=>o.remove(),180);res(v)};
    o.addEventListener('click',e=>{
      if(e.target===o)return close(null);
      const b=e.target.closest('[data-m]');if(!b)return;
      if(b.dataset.m==='ok'){const f={};o.querySelectorAll('[data-f]').forEach(x=>f[x.dataset.f]=x.value.trim());return close(f)}
      close(b.dataset.m);
    });
    document.addEventListener('keydown',kd);document.body.append(o);o.querySelector('[data-f]')?.focus();
  })},
  choose(title,opts,cur){return Modal.open(`<h3>${title}</h3>`+opts.map(([v,l])=>`<button class="opt ${v===cur?'sel':''}" data-m="${v}"><span>${l}</span><i class="rd"></i></button>`).join(''))},
  async confirm(title,text,ok='Tamam'){return (await Modal.open(`<h3>${title}</h3><p>${text}</p><div class="btns"><button class="btn" data-m="no">Vazgeç</button><button class="btn pri" data-m="yes">${ok}</button></div>`))==='yes'},
  alert(title,text,ok='Tamam'){return Modal.open(`<h3>${title}</h3><p>${text}</p><div class="btns"><button class="btn pri" data-m="yes">${ok}</button></div>`)},
  async prompt(title,text,val='',ph=''){const r=await Modal.open(`<h3>${title}</h3><p>${text}</p><textarea data-f="v" rows="4" placeholder="${esc(ph)}">${esc(val)}</textarea><div class="btns"><button class="btn" data-m="no">Vazgeç</button><button class="btn pri" data-m="ok">Kaydet</button></div>`);return r&&typeof r==='object'?r.v:null}
};

/* ================= Daha önce bağlanılan cihazlar ================= */
const Prev={
  id:n=>'prev-'+n.toLowerCase().replace(/\s+/g,'-'),
  add(n,last){const id=Prev.id(n);if(!S.prev.find(p=>p.id===id)){S.prev.push({id,name:n,added:Date.now(),last:last||null});save()}},
  mark(name){const p=S.prev.find(x=>x.name.toLowerCase()===name.toLowerCase());if(p){p.last=Date.now();save()}else Prev.add(name,Date.now())}
};

/* ================= Geçmiş ================= */
const Hist={
  add(type,d,val){S.hist.push({t:Date.now(),type,id:d.id,name:d.name,val});if(S.hist.length>400)S.hist.splice(0,S.hist.length-400);save()}
};

/* ================= Bluetooth modülü ================= */
const Bt={
  supported:()=>!!navigator.bluetooth,
  OPT:{acceptAllDevices:true,optionalServices:['battery_service','device_information']},
  async availability(){
    if(!Bt.supported())return null;
    try{return await navigator.bluetooth.getAvailability()}catch{return null}
  },
  /* Kayıt: gerçek cihaz nesnesini listeye ekle */
  register(dev,extra={}){
    let d=S.devices.get(dev.id);
    if(!d){d={id:dev.id,name:dev.name||'Adsız cihaz',obj:dev,type:'BLE',connected:false,battery:null,cells:[],rssi:null,updated:Date.now(),since:null,maker:null,paired:false,nearby:false};S.devices.set(dev.id,d)}
    d.obj=dev;Object.assign(d,extra);
    S.known[d.id]={name:d.name,last:Date.now(),state:d.connected?'connected':'seen'};save();return d;
  },
  /* Daha önce izin verilen cihazlar */
  async loadPaired(){
    if(!navigator.bluetooth?.getDevices)return false;
    try{(await navigator.bluetooth.getDevices()).forEach(x=>Bt.register(x,{paired:true}));return true}catch{return false}
  },
  /* Tarama: önce LE Scan (deneysel), olmazsa tarayıcının seçici penceresi */
  async scan(){
    if(!Bt.supported())return Notify.show(t('unsup'),'warn');
    if(S.demo)return Demo.scan();
    S.scanning=true;UI.render();
    try{
      if(navigator.bluetooth.requestLEScan){
        const sc=await navigator.bluetooth.requestLEScan({acceptAllAdvertisements:true,keepRepeatedDevices:false});
        const h=e=>{const d=Bt.register(e.device,{rssi:e.rssi,nearby:true,updated:Date.now()});UI.softRender()};
        navigator.bluetooth.addEventListener('advertisementreceived',h);
        await new Promise(r=>setTimeout(r,S.scanSec*1000));
        sc.stop();navigator.bluetooth.removeEventListener('advertisementreceived',h);
      }else{
        const dev=await navigator.bluetooth.requestDevice(Bt.OPT);
        const d=Bt.register(dev,{nearby:true,paired:true});
        try{const ad=dev.watchAdvertisements&&await dev.watchAdvertisements();dev.addEventListener('advertisementreceived',e=>{d.rssi=e.rssi;d.updated=Date.now();UI.softRender()},{once:true})}catch{}
      }
      Notify.show('Tarama tamamlandı','ok');
    }catch(e){if(e.name!=='NotFoundError')Notify.show('Tarama: '+e.message,'warn')}
    S.scanning=false;UI.render();
  },
  async tryPrev(p){
    if(!Bt.supported())return Modal.alert('Desteklenmiyor',t('unsup'));
    let d=[...S.devices.values()].find(x=>x.name.toLowerCase()===p.name.toLowerCase());
    if(!d){
      try{const dev=await navigator.bluetooth.requestDevice({filters:[{name:p.name}],optionalServices:['battery_service','device_information']});d=Bt.register(dev,{paired:true,nearby:true})}
      catch(e){if(e.name==='NotFoundError')Modal.alert('Cihaz bulunamadı','“'+esc(p.name)+'” yakında görünmüyor ya da seçim iptal edildi. Cihazı eşleştirme moduna alıp tekrar deneyin. Klasik Bluetooth cihazlar (ses/kulaklık) Web Bluetooth ile görünmez.');else Notify.show('Hata: '+e.message,'warn');return}
    }
    await Bt.connect(d);
  },
  async connect(d){
    if(d.demo)return Demo.connect(d);
    if(!d.obj?.gatt)return Notify.show('Bu cihaz için GATT erişimi yok.','warn');
    try{
      const srv=await d.obj.gatt.connect();
      d.connected=true;d.since=Date.now();d.updated=Date.now();
      d.obj.addEventListener('gattserverdisconnected',()=>Bt.onDisc(d),{once:true});
      try{ /* Pil servisi (TWS'de birden fazla örnek olabilir) */
        const svc=await srv.getPrimaryService('battery_service');
        const chs=await svc.getCharacteristics('battery_level');d.cells=[];
        for(const [i,c] of chs.entries()){
          d.cells[i]=(await c.readValue()).getUint8(0);
          try{await c.startNotifications();c.addEventListener('characteristicvaluechanged',e=>{d.cells[i]=e.target.value.getUint8(0);Bt.setBattery(d)})}catch{}
        }
        Bt.setBattery(d);d.batteryOK=true;
      }catch{d.batteryOK=false}
      try{const di=await srv.getPrimaryService('device_information');d.maker=new TextDecoder().decode(await(await di.getCharacteristic('manufacturer_name_string')).readValue())}catch{}
      Hist.add('connect',d);Prev.mark(d.name);Notify.show(d.name+' bağlandı','ok');S.known[d.id]={name:d.name,last:Date.now(),state:'connected'};save();
    }catch(e){Notify.show('Bağlanılamadı: '+e.message,'warn')}
    UI.render();
  },
  setBattery(d){
    const prev=d.battery;d.battery=d.cells[0];d.updated=Date.now();
    if(prev!==d.battery){Hist.add('battery',d,d.battery);if(d.battery<=20&&(prev==null||prev>20))Notify.show(d.name+': pil düştü %'+d.battery,'warn')}
    UI.softRender();
  },
  onDisc(d){d.connected=false;Hist.add('disconnect',d,d.since?Date.now()-d.since:0);d.since=null;Notify.show(d.name+' bağlantısı kesildi','warn');S.known[d.id].state='disconnected';save();UI.render()},
  disconnect(d){d.demo?Demo.disc(d):d.obj?.gatt?.disconnect()},
  async reconnect(d){
    if(d.obj?.watchAdvertisements&&!d.connected){try{await d.obj.watchAdvertisements()}catch{}}
    return Bt.connect(d);
  }
};
/* Bluetooth açık/kapalı izleme */
async function watchBt(){
  const av=await Bt.availability();setBt(av);
  navigator.bluetooth?.addEventListener?.('availabilitychanged',e=>setBt(e.value));
}
function setBt(v){
  if(S.btOn!==null&&S.btOn!==v&&v!=null)Notify.show(v?'Bluetooth açıldı':'Bluetooth kapandı','warn');
  S.btOn=v;UI.header();
}

/* ================= Demo modu (ayrı seçenek) ================= */
const Demo={
  list:[{id:'demo-1',name:'Galaxy Buds FE',type:'BLE',tws:true},{id:'demo-2',name:'JBL Tune 230NC',type:'Classic',tws:false},{id:'demo-3',name:'Sony WH-1000XM5',type:'Classic',tws:false},{id:'demo-4',name:'Bluetooth Fare',type:'BLE',tws:false}],
  timer:null,
  on(){
    Demo.list.forEach((x,i)=>S.devices.set(x.id,{...x,demo:true,obj:null,connected:i===0,battery:80-i*12,cells:x.tws?[78,64,92]:[80-i*12],rssi:-45-i*9,updated:Date.now(),since:i===0?Date.now():null,paired:true,nearby:true,batteryOK:true,maker:brandOf(x.name),chg:x.tws?[false,false,true]:[false]}));
    Demo.timer=setInterval(()=>{S.devices.forEach(d=>{if(d.demo&&d.connected){d.cells=d.cells.map((c,i)=>Math.max(5,c-(Math.random()<.4?1:0)));d.battery=d.cells[0];d.rssi=-40-Math.floor(Math.random()*25);d.updated=Date.now()}});UI.softRender()},5000);
  },
  off(){clearInterval(Demo.timer);[...S.devices.keys()].forEach(k=>k.startsWith('demo-')&&S.devices.delete(k))},
  scan(){S.scanning=true;UI.render();setTimeout(()=>{S.scanning=false;UI.render();Notify.show('Tarama tamamlandı','ok')},1200)},
  connect(d){d.connected=true;d.since=Date.now();Hist.add('connect',d);Notify.show(d.name+' bağlandı','ok');UI.render()},
  disc(d){Bt.onDisc(d)}
};

/* ================= Arayüz ================= */
const TABS=[['connected','🔗'],['paired','📚'],['nearby','📡'],['favs','⭐'],['history','📊'],['settings','⚙️']];
const UI={
  init(){
    $('#nav').innerHTML=TABS.map(([k,i])=>`<button data-tab="${k}"><span class="i">${i}</span><span data-i="${k}"></span></button>`).join('');
    document.addEventListener('click',UI.click);
    document.addEventListener('input',UI.input);
    document.addEventListener('change',UI.input);
    setInterval(()=>document.querySelectorAll('[data-since]').forEach(e=>e.textContent=fmtDur(Date.now()-e.dataset.since)),1000);
    UI.theme();UI.i18n();UI.render();
  },
  theme(){
    const dark=S.theme==='dark'||(S.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
    document.documentElement.dataset.theme=dark?'dark':'light';
    document.documentElement.style.setProperty('--h',S.hue);
    document.body.classList.toggle('noanim',!S.anim);
  },
  i18n(){document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.documentElement.lang=S.lang},
  header(){
    const on=S.btOn,u=!Bt.supported();
    $('#dot').className='dot'+(on?' on':'');
    $('#stTxt').textContent=u?t('unsup'):on===false?t('off'):t('on');
    $('#stSub').textContent=u?'Chrome/Edge (Android, masaüstü) önerilir':!isSecureContext?t('secure'):on==null?'Durum okunamadı (API sınırı)':'';
  },
  /* Sadece geçerli sekmeyi yeniden çiz (hafif) */
  softRender(){cancelAnimationFrame(UI._r);UI._r=requestAnimationFrame(()=>{if(S.tab!=='settings'&&!document.activeElement?.matches('input'))UI.render()})},
  render(){
    document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
    const v=$('#view'),devs=[...S.devices.values()],q=S.q.toLowerCase();
    const f=l=>l.filter(d=>!q||(d.name+' '+(brandOf(d.name)||'')).toLowerCase().includes(q));
    let h='';
    const search=`<input type="search" id="q" placeholder="🔎 Ara…" value="${esc(S.q)}">`;
    switch(S.tab){
      case 'connected':h=Views.list(f(devs.filter(d=>d.connected)),'connected');break;
      case 'paired':h=Views.paired(f(devs.filter(d=>d.paired)));break;
      case 'nearby':h=search+(S.scanning?'<div class="empty">📡 Taranıyor…</div>':'')+Views.list(f(devs.filter(d=>d.nearby)),'nearby');break;
      case 'favs':h=Views.list(f(devs.filter(d=>S.favs[d.id])).concat(Object.keys(S.favs).filter(id=>!S.devices.has(id)).map(id=>({id,name:S.favs[id].name,ghost:true}))),'favs');break;
      case 'history':h=Views.history();break;
      case 'settings':h=Views.settings();break;
    }
    v.innerHTML=h;UI.i18n();
  },
  async click(e){
    const tb=e.target.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;return UI.render()}
    const b=e.target.closest('[data-act]');if(!b)return;
    const a=b.dataset.act,d=S.devices.get(b.dataset.id);
    switch(a){
      case 'scan':if(S.tab!=='nearby'){S.tab='nearby'}Bt.scan();break;
      case 'refresh':await Bt.loadPaired();setBt(await Bt.availability());UI.render();Notify.show('Yenilendi');break;
      case 'enable':{const an=/android/i.test(navigator.userAgent);
        const ok=await Modal.confirm('Bluetooth’u aç','Tarayıcılar Bluetooth’u kodla açamaz. Telefonunuzun hızlı panelinden veya ayarlar ekranından açabilirsiniz.',an?'Ayarları aç':'Tamam');
        if(ok&&an)location.href='intent:#Intent;action=android.settings.BLUETOOTH_SETTINGS;end';break}
      case 'theme':{const v=await Modal.choose('Tema',[['auto','Otomatik (sistem)'],['light','Açık'],['dark','Koyu']],S.theme);if(v){S.theme=v;save();UI.theme();UI.render()}break}
      case 'addprev':{const r=await Modal.prompt('Cihaz ekle','Telefonunuzun Bluetooth ayarlarındaki “Eşleşen cihazlar” listesinden adları yazın. Her satıra bir cihaz.','','BU BİR KULAKLIK\nTWS\nBT5.4 Mouse');
        if(r){r.split('\n').map(x=>x.trim()).filter(Boolean).forEach(n=>Prev.add(n));UI.render()}break}
      case 'tryprev':{const p=S.prev.find(x=>x.id===b.dataset.id);if(p)Bt.tryPrev(p);break}
      case 'delprev':{const p=S.prev.find(x=>x.id===b.dataset.id);if(p&&await Modal.confirm('Listeden kaldır','“'+esc(p.name)+'” bu listeden kaldırılsın mı? Telefonunuzdaki eşleşme etkilenmez.','Kaldır')){S.prev=S.prev.filter(x=>x!==p);delete S.favs[p.id];save();UI.render()}break}
      case 'connect':d&&Bt.connect(d);break;
      case 'reconnect':d&&Bt.reconnect(d);break;
      case 'disc':d&&Bt.disconnect(d);break;
      case 'fav':if(S.favs[b.dataset.id])delete S.favs[b.dataset.id];else S.favs[b.dataset.id]={name:d?.name||S.prev.find(x=>x.id===b.dataset.id)?.name,note:''};save();UI.render();break;
      case 'note':{const f=S.favs[b.dataset.id];if(f){const n=await Modal.prompt('Not','Bu cihaz için kısa bir not yazın.',f.note||'','Örn. iş yerindeki kulaklık');if(n!==null){f.note=n;save();UI.render()}}break}
      case 'pick':try{const dev=await navigator.bluetooth.requestDevice(Bt.OPT);Bt.register(dev,{paired:true});UI.render()}catch(x){}break;
      case 'clear':if(await Modal.confirm('Geçmişi temizle','Tüm bağlantı ve pil kayıtları silinecek.','Temizle')){S.hist=[];save();UI.render()}break;
      case 'perm':if(await Modal.confirm('Bluetooth izinleri','Bluetooth erişimi, cihaz seçerken tarayıcı tarafından sorulur ve kodla verilemez. Buradan yalnızca bildirim iznini isteyebilirsiniz.','Bildirim izni iste'))Notify.ask();break;
    }
  },
  input(e){
    const el=e.target;
    if(el.id==='q'){S.q=el.value;UI.render();$('#q').focus();$('#q').setSelectionRange(99,99);return}
    const k=el.dataset.set;if(!k)return;
    S[k]=el.type==='checkbox'?el.checked:el.type==='range'?+el.value:el.value;save();
    if(k==='demo'){S.demo?Demo.on():Demo.off();UI.render()}
    if(k==='notif'&&S.notif)Notify.ask();
    if(['theme','hue','anim'].includes(k))UI.theme();
    if(k==='lang'){UI.i18n();UI.render();UI.header()}
  }
};

/* ================= Görünümler ================= */
const Views={
  info:`<div class="note glass">ℹ️ Web Bluetooth yalnızca <b>BLE</b> (GATT) cihazlarla çalışır. Klasik Bluetooth (A2DP/HFP ses) bağlantıları ve sistem eşleşme listesi tarayıcıya açılmaz; bu nedenle Klasik cihazlar yalnızca demo modunda gösterilir.</div>`,
  card(d,ctx){
    if(d.ghost)return `<div class="card glass"><div class="row"><div class="ico">⭐</div><div><div class="nm">${esc(d.name)}</div><div class="sub">Şu an listede değil · önce tara</div></div></div>${Views.favNote(d)}</div>`;
    const br=d.maker||brandOf(d.name),low=d.battery!=null&&d.battery<=20;
    const isTws=d.cells?.length>1;
    return `<div class="card glass">
      <div class="row"><div class="ico">${iconOf(d.name)}</div><div style="min-width:0"><div class="nm">${esc(d.name)}</div>
        <div class="sub"><span class="tag">${d.type==='Classic'?'Klasik':'BLE'}</span>${d.connected?'<span class="tag" style="background:var(--ok);color:#fff">Bağlı</span>':'Bağlı değil'}</div></div></div>
      <div class="meta"><span>Üretici <b>${esc(br||'Bilinmiyor')}</b></span><span>Sinyal <b>${d.rssi!=null?d.rssi+' dBm':'—'}</b></span>
        <span>Güncelleme <b>${ago(d.updated)}</b></span><span>Süre <b data-since="${d.since||0}">${d.since?fmtDur(Date.now()-d.since):'—'}</b></span></div>
      ${d.battery!=null?`<div class="sub" style="margin-bottom:4px">🔋 %${d.battery}</div><div class="bar"><i class="${low?'low':''}" style="width:${d.battery}%"></i></div>`:
        d.connected?`<div class="sub">🔋 Pil bilgisi yok: cihaz Battery Service (GATT) paylaşmıyor.</div>`:''}
      ${d.connected?Views.tws(d,isTws):''}
      <div class="acts" style="margin-top:12px">
        ${d.connected?`<button class="btn sm" data-act="disc" data-id="${esc(d.id)}">${t('disc')}</button>`:`<button class="btn sm pri" data-act="${ctx==='paired'?'reconnect':'connect'}" data-id="${esc(d.id)}">${ctx==='paired'?'Tekrar dene':t('connect')}</button>`}
        <button class="btn sm" data-act="fav" data-id="${esc(d.id)}">${S.favs[d.id]?'★ '+t('unfav'):'☆ '+t('fav')}</button></div>
      ${S.favs[d.id]?Views.favNote(d):''}</div>`;
  },
  favNote:d=>`<div class="sub" style="margin-top:10px">📝 ${esc(S.favs[d.id]?.note||'Not yok')} <a href="#" data-act="note" data-id="${esc(d.id)}" onclick="return false" style="color:var(--p)">✎</a></div>`,
  /* TWS: sol / sağ / kutu */
  tws(d,isTws){
    if(!isTws)return `<div class="note glass" style="margin:12px 0 0;padding:10px;font-size:12px">TWS ayrıntısı (sol/sağ/kutu) gösterilemiyor: cihaz tek bir pil değeri paylaşıyor. Üreticiye özel (Samsung, Apple, Sony…) protokoller tarayıcıdan erişilemez.</div>`;
    const L=['Sol','Sağ','Kutu'],ic=['🎧','🎧','🔋'];
    return `<div class="tws">${d.cells.slice(0,3).map((c,i)=>`<div><span>${ic[i]} ${L[i]}</span><span class="big ${d.chg?.[i]?'chg':''}">%${c}</span><span class="sub">${i===2?'Kutuda':'Kullanımda'}</span></div>`).join('')}</div>`;
  },
  list(arr,ctx){return (ctx==='nearby'?'':'')+(Bt.supported()||S.demo?'':`<div class="note glass">${t('unsup')}</div>`)+(arr.length?`<div class="grid">${arr.map(d=>Views.card(d,ctx)).join('')}</div>`:`<div class="empty">${ctx==='connected'?Views.info:''}${t('nodev')}</div>`)},
  paired(arr){
    const q=S.q.toLowerCase(),pv=S.prev.filter(p=>!q||p.name.toLowerCase().includes(q));
    return `<div class="note glass">ℹ️ Tarayıcılar telefonun sistem eşleşme listesini okuyamaz. Bu yüzden “Daha önce bağlanılanlar” listesini siz oluşturursunuz; bu uygulamada bağlandığınız cihazlar da buraya otomatik eklenir.</div>
    <div class="row" style="justify-content:space-between;margin:4px 4px 10px"><h3>Daha önce bağlanılanlar</h3><button class="btn sm pri" data-act="addprev">+ Cihaz ekle</button></div>`
    +(pv.length?`<div class="grid">${pv.map(Views.prev).join('')}</div>`:`<div class="empty">Henüz cihaz yok. “Cihaz ekle” ile telefonunuzdaki eşleşen cihazların adlarını girin.</div>`)
    +`<div class="row" style="justify-content:space-between;margin:22px 4px 10px"><h3>Bu uygulamaya izin verilenler</h3><button class="btn sm" data-act="pick">+ ${t('pickDev')}</button></div>`
    +(navigator.bluetooth?.getDevices?'':`<div class="note glass">⚠️ Bu tarayıcı getDevices() sunmuyor; yalnızca bu uygulamada seçtiğiniz cihazlar listelenir.</div>`)
    +(arr.length?`<div class="grid">${arr.map(d=>Views.card(d,'paired')).join('')}</div>`:`<div class="empty">${t('nodev')}</div>`);
  },
  prev(p){
    const live=[...S.devices.values()].some(d=>d.connected&&d.name.toLowerCase()===p.name.toLowerCase());
    return `<div class="card glass"><div class="row"><div class="ico">${iconOf(p.name)}</div><div style="min-width:0"><div class="nm">${esc(p.name)}</div>
      <div class="sub">${live?'Şu an bağlı':p.last?'Son bağlantı: '+new Date(p.last).toLocaleString():'Telefon listesinden eklendi'}</div></div></div>
      <div class="acts" style="margin-top:12px"><button class="btn sm pri" data-act="tryprev" data-id="${esc(p.id)}">Bağlanmayı dene</button>
      <button class="btn sm" data-act="fav" data-id="${esc(p.id)}">${S.favs[p.id]?'★ Favoriden çıkar':'☆ Favori'}</button>
      <button class="btn sm" data-act="delprev" data-id="${esc(p.id)}">Kaldır</button></div>${S.favs[p.id]?Views.favNote(p):''}</div>`;
  },
  history(){
    const h=S.hist,conn=h.filter(x=>x.type==='connect').length,dur=h.filter(x=>x.type==='disconnect').reduce((a,x)=>a+(x.val||0),0);
    const bat=h.filter(x=>x.type==='battery').slice(-40);
    const pts=bat.map((x,i)=>`${bat.length>1?i*300/(bat.length-1):0},${110-x.val}`).join(' ');
    const lbl={connect:'Bağlandı',disconnect:'Kesildi',battery:'Pil'};
    return `<div class="grid" style="margin-bottom:12px"><div class="card glass"><div class="sub">Bağlantı</div><div class="nm" style="font-size:28px">${conn}</div></div>
      <div class="card glass"><div class="sub">Toplam süre</div><div class="nm" style="font-size:28px">${fmtDur(dur)}</div></div></div>
      <div class="card glass" style="margin-bottom:12px"><div class="sub">Pil grafiği (son ${bat.length})</div>${bat.length>1?`<svg class="chart" viewBox="0 0 300 120" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--p)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`:'<div class="empty">Yeterli veri yok</div>'}</div>
      <div class="card glass">${h.slice(-30).reverse().map(x=>`<div class="set"><span>${esc(x.name)} · ${lbl[x.type]}${x.type==='battery'?' %'+x.val:x.type==='disconnect'&&x.val?' ('+fmtDur(x.val)+')':''}</span><span class="sub">${new Date(x.t).toLocaleString()}</span></div>`).join('')||'<div class="empty">Kayıt yok</div>'}
      ${h.length?`<div class="set"><button class="btn sm" data-act="clear">Geçmişi temizle</button></div>`:''}</div>`;
  },
  settings(){
    const sw=(k,l)=>`<div class="set"><span>${l}</span><input class="sw" type="checkbox" data-set="${k}" ${S[k]?'checked':''}></div>`;
    return `<div class="glass">
      <div class="set"><span>Tema</span><button class="btn sm" data-act="theme">${{auto:'Otomatik',light:'Açık',dark:'Koyu'}[S.theme]} ▾</button></div>
      <div class="set"><span>Renk (Material You)</span><input type="range" min="0" max="360" value="${S.hue}" data-set="hue" style="accent-color:var(--p)"></div>
      <div class="set"><span>Dil</span><span class="sub">Türkçe</span></div>
      ${sw('anim','Animasyonlar')}${sw('notif','Bildirimler')}${sw('vib','Titreşim')}${sw('auto','Otomatik tarama')}
      <div class="set"><span>Tarama süresi: ${S.scanSec} sn</span><input type="range" min="3" max="30" value="${S.scanSec}" data-set="scanSec" style="accent-color:var(--p)"></div>
      <div class="set"><span>Bluetooth izinleri</span><button class="btn sm" data-act="perm">İzinleri yönet</button></div>
      ${sw('demo','Demo modu (örnek cihazlar)')}</div>
      <div class="note glass" style="margin-top:12px">Bluetooth erişim izni cihaz seçerken tarayıcı tarafından istenir; sistem düzeyinde iznin kodla açılması mümkün değildir.</div>`;
  }
};

/* ================= PWA manifest (satır içi) ================= */
(function(){
  const m={name:'BT Yönetici',short_name:'BTM',display:'standalone',start_url:'.',background_color:'#121016',theme_color:'#6750a4',
    icons:[{src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><rect width="96" height="96" rx="24" fill="#6750a4"/><path d="M34 34l28 28-14 14V20l14 14-28 28" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>'),sizes:'any',type:'image/svg+xml'}]};
  const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/json'}));document.head.append(l);
})();

/* ================= Açılış ================= */
(async function boot(){
  const steps=$('#sp-steps'),log=m=>steps.innerHTML+=m+'<br>',wait=ms=>new Promise(r=>setTimeout(r,ms));
  UI.theme();
  log('Destek kontrol ediliyor…');await wait(350);
  log(Bt.supported()?'✓ Web Bluetooth destekleniyor':'✗ Web Bluetooth yok');
  log(isSecureContext?'✓ Güvenli bağlam':'✗ HTTPS/localhost gerekli');await wait(300);
  const av=await Bt.availability();log(av===true?'✓ Bluetooth açık':av===false?'✗ Bluetooth kapalı':'• Bluetooth durumu okunamadı');
  log('İzinler kontrol ediliyor…');
  if(await Bt.loadPaired())log('✓ Kayıtlı cihazlar yüklendi');
  await wait(400);
  $('#app').hidden=false;UI.init();setBt(av);watchBt();
  if(S.demo)Demo.on();UI.render();
  $('#splash').classList.add('off');setTimeout(()=>$('#splash').remove(),600);
  if(S.auto&&Bt.supported()&&navigator.bluetooth.requestLEScan)setTimeout(()=>Bt.scan(),800); // otomatik tarama (LE Scan destekliyse)
  matchMedia('(prefers-color-scheme:dark)').addEventListener('change',UI.theme);
})();
</script>
